services:
  arasaka:
    image: arasaka
    container_name: ${CONTAINER_NAME}
    init: true
    stdin_open: true
    tty: true
    command: ["/bin/bash", "-c", "${COMMAND}"]
    volumes:
      - ${ROOT_DIR}:/root/arasaka:${WRITE_MODE}
      - ${OUTPUT_DIR}:/root/arasaka/output/${REPO_NAME}
      - ${SRC_DIR}:/src/${REPO_NAME}

    security_opt:
      - seccomp=unconfined
    
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    
    environment:
      - AUTO_CLEAN=${AUTO_CLEAN:-0}

      - SRC=/src/${REPO_NAME}
      - OUTPUT=/root/arasaka/output/${REPO_NAME}
      
      - AFL_SKIP_CPUFREQ=1
      - AFL_NUM_CORES=${AFL_NUM_CORES:-8}

      - PYTHONUNBUFFERED=1
      
      - UV_PROJECT_ENVIRONMENT=/root/.venv
      - UV_LINK_MODE=copy
      
      - FUZZ_ENGINE=${FUZZ_ENGINE}
      - FUZZ_DURATION=${FUZZ_DURATION:-24h}
      
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.6}
      - LLM_TOP_P=${LLM_TOP_P:-0.9}
      - LLM_TOP_K=${LLM_TOP_K:-20}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-600}
      
      - MAX_EPOCH=${MAX_EPOCH:-100}
      - MAX_TOKEN_LEN=${MAX_TOKEN_LEN:-128000}
      - REMINDER_TOKEN_RATIO=${REMINDER_TOKEN_RATIO:-0.8}
      
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_BUCKET=${OSS_BUCKET:-}
    restart: "no"
