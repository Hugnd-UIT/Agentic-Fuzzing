services:
  agentic-fuzzing:
    image: agentic-fuzzing
    container_name: ${CONTAINER_NAME}
    init: true
    stdin_open: true
    tty: true
    command: ["/bin/bash", "-c", "${COMMAND}"]
    volumes:
      - ${AGENTIC_FUZZING_DIR}:/root/agentic-fuzzing:${WRITE_MODE}
      - ${RAW_OUTPUT_DIR}:/root/agentic-fuzzing/output/${REPO_BASE_NAME}
      - ${SRC_DIR}:/src/${REPO_BASE_NAME}
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    environment:
      - AGENTIC_FUZZING_AUTO_CLEAN=${AGENTIC_FUZZING_AUTO_CLEAN:-0}
      - SRC=/src/${REPO_BASE_NAME}
      - OUTPUT=/root/agentic-fuzzing/output/${REPO_BASE_NAME}
      - AFL_SKIP_CPUFREQ=1
      - AFL_NUM_CORES=${AFL_NUM_CORES:-8}
      - PYTHONUNBUFFERED=1
      - UV_PROJECT_ENVIRONMENT=/root/.venv
      - UV_LINK_MODE=copy
      - FUZZING_ENGINE=${FUZZING_ENGINE}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.6}
      - LLM_TOP_P=${LLM_TOP_P:-0.9}
      - LLM_TOP_K=${LLM_TOP_K:-20}
      - LLM_REPLY_TIMEOUT=${LLM_REPLY_TIMEOUT:-600}
      - MAX_AGENT_EPOCHS=${MAX_AGENT_EPOCHS:-100}
      - FUZZING_DURATION=${FUZZING_DURATION:-24h}
      - REMINDER_TOKEN_RATIO=${REMINDER_TOKEN_RATIO:-0.8}
      - MAX_TOKEN_LEN=${MAX_TOKEN_LEN:-128000}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_BUCKET=${OSS_BUCKET:-}
    restart: "no"
